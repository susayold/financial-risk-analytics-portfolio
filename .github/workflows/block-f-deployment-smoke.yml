name: Block F Deployment Smoke

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate live GitHub Pages surface
        env:
          BLOCK_F_LIVE_BASE_URL: https://susayold.github.io/financial-risk-analytics-portfolio/
          BLOCK_F_SMOKE_ATTEMPTS: '24'
          BLOCK_F_SMOKE_DELAY_SECONDS: '5'
        run: |
          mkdir -p outputs/block-f
          python scripts/block_f_live_smoke.py | tee outputs/block-f/live-smoke.txt

      - name: Upload live-smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: block-f-live-smoke
          path: outputs/block-f/live-smoke.txt
          if-no-files-found: error
