name: Block F Remediate Architecture OG

on:
  push:
    branches:
      - block-f-final-closure
    paths:
      - .github/workflows/block-f-remediate-architecture-og.yml

permissions:
  contents: write

jobs:
  patch-architecture-og:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: block-f-final-closure
          fetch-depth: 0

      - name: Patch Architecture OG image
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('architecture/index.html')
          text = path.read_text(encoding='utf-8')
          old = '../assets/og/crdpi-governance.svg'
          new = '../assets/og/crdpi-architecture.svg'
          if new in text and old not in text:
              print('Architecture OG already patched')
          else:
              if old not in text:
                  raise SystemExit('Expected governance OG reference not found')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
              print('Architecture OG reference patched')
          PY

      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No patch required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add architecture/index.html
          git commit -m "fix(block-f): use architecture-specific OG image"
          git push origin HEAD:block-f-final-closure
