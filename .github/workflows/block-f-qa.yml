name: Block F QA

on:
  push:
    branches:
      - main
      - block-f-final-closure
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  block-f-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Python test dependencies
        run: python -m pip install --upgrade pytest numpy pandas

      - name: Build all seven public data contracts
        run: python scripts/build_all_public_data.py

      - name: Verify deterministic public build
        id: determinism
        continue-on-error: true
        run: python scripts/check_public_build_determinism.py

      - name: Run repository tests
        id: pytest_initial
        continue-on-error: true
        run: |
          mkdir -p outputs/block-f
          set +e
          pytest -q --tb=short > outputs/block-f/pytest-initial.txt 2>&1
          code=$?
          set -e
          cat outputs/block-f/pytest-initial.txt
          exit $code

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Start static server
        run: |
          python -m http.server 8000 --bind 127.0.0.1 > /tmp/crdpi-http.log 2>&1 &
          echo $! > /tmp/crdpi-http.pid
          sleep 2

      - name: Run browser route, responsive, accessibility and visual QA
        id: browser_qa
        continue-on-error: true
        env:
          BLOCK_F_BASE_URL: http://127.0.0.1:8000
        run: node scripts/block_f_browser_qa.mjs

      - name: Run Block F reconciliation, claim and privacy QA
        id: analytical_qa
        if: always()
        continue-on-error: true
        run: python scripts/run_block_f_qa.py

      - name: Rebuild Page 07 from QA state
        id: rebuild_page07
        if: always()
        continue-on-error: true
        run: python scripts/build_page07_public_data.py

      - name: Re-run tests after QA state build
        id: pytest_final
        if: always()
        continue-on-error: true
        run: |
          set +e
          pytest -q --tb=short > outputs/block-f/pytest-final.txt 2>&1
          code=$?
          set -e
          cat outputs/block-f/pytest-final.txt
          exit $code

      - name: Scan final public bundle
        id: bundle_scan
        if: always()
        continue-on-error: true
        run: python scripts/validate_public_bundle.py

      - name: Upload Block F QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: block-f-qa-evidence
          path: |
            outputs/block-f/
            block-f/BLOCK_F_FINAL_QA.json
          if-no-files-found: warn

      - name: Enforce final Block F gate
        if: always()
        env:
          DETERMINISM: ${{ steps.determinism.outcome }}
          PYTEST_INITIAL: ${{ steps.pytest_initial.outcome }}
          BROWSER_QA: ${{ steps.browser_qa.outcome }}
          ANALYTICAL_QA: ${{ steps.analytical_qa.outcome }}
          REBUILD_PAGE07: ${{ steps.rebuild_page07.outcome }}
          PYTEST_FINAL: ${{ steps.pytest_final.outcome }}
          BUNDLE_SCAN: ${{ steps.bundle_scan.outcome }}
        run: |
          python - <<'PY'
          import os
          checks = {
              "determinism": os.environ["DETERMINISM"],
              "pytest_initial": os.environ["PYTEST_INITIAL"],
              "browser_qa": os.environ["BROWSER_QA"],
              "analytical_qa": os.environ["ANALYTICAL_QA"],
              "rebuild_page07": os.environ["REBUILD_PAGE07"],
              "pytest_final": os.environ["PYTEST_FINAL"],
              "bundle_scan": os.environ["BUNDLE_SCAN"],
          }
          failed = {name: status for name, status in checks.items() if status != "success"}
          print("Block F aggregate gate:", checks)
          if failed:
              raise SystemExit(f"Block F fail-closed: {failed}")
          print("Block F aggregate gate PASS")
          PY
