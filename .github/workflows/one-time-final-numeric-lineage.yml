name: One-time Final Numeric Lineage

on:
  push:
    branches:
      - fix-block-c-psi-lineage

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install --upgrade pytest numpy pandas
      - name: Apply numeric lineage patch
        run: python scripts/apply_final_numeric_lineage_patch.py
      - name: Rebuild all public contracts
        run: python scripts/build_all_public_data.py
      - name: Run repository tests
        run: pytest -q --tb=short
      - name: Commit remediated source and generated contracts
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/block-c/C9_PUBLIC_CLOSURE_SUMMARY.json \
                  scripts/build_page03_public_data.py \
                  scripts/block_f_live_smoke.py \
                  tests/test_page03_model_decisioning.py \
                  tests/test_website_reconciliation.py \
                  model-decisioning/index.html \
                  public/data/page-03-model-decisioning.json
          if git diff --cached --quiet; then
            echo "No remediation changes to commit"
          else
            git commit -m "fix(block-f): restore canonical Block C PSI lineage"
            git push origin HEAD:fix-block-c-psi-lineage
          fi
